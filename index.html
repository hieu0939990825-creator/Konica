<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1830">
    <title>Tra Cứu ITEM CODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f5f2ec; --bg-soft: #faf8f4; --surface: #ffffff; --ink: #151a26; --muted: #6c7385;
            --line: #e9e3d7; --gold: #b48a3c; --gold-soft: #f6edd8; --gold-line: #e8d6a8; --gold-ink: #6b5420;
            --navy: #0d1830; --ok: #0f7a4d; --ok-soft: #e3f4ec; --warn: #a15c07; --warn-soft: #fdf0d8;
            --shadow: 0 1px 2px rgba(20,24,38,.04), 0 10px 28px -10px rgba(20,24,38,.16);
            --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #090d17; --bg-soft: #0f1523; --surface: #131a2b; --ink: #eef0f6; --muted: #9aa3b8;
                --line: #232c42; --gold: #d4b06a; --gold-soft: #2a2415; --gold-line: #5a4a24; --gold-ink: #e6cf98;
                --ok: #4ade9b; --ok-soft: #12301f; --warn: #f3b552; --warn-soft: #33260c;
                --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -12px rgba(0,0,0,.6);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); }
        body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        button { font-family: inherit; }

        /* ---------- Hero ---------- */
        .hero {
            background:
                radial-gradient(120% 120% at 85% -10%, rgba(88,120,200,.38) 0%, transparent 55%),
                radial-gradient(90% 90% at 0% 110%, rgba(212,176,106,.16) 0%, transparent 60%),
                linear-gradient(165deg, #0f1d3a 0%, #0a1226 100%);
            border-bottom: 1px solid rgba(212,176,106,.4);
            padding: calc(env(safe-area-inset-top, 0px) + 26px) 20px 62px;
            text-align: center;
        }
        .hero-inner { max-width: 560px; margin: 0 auto; }
        .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #d9bd83; margin-bottom: 8px; }
        .hero h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.15; color: #fff; letter-spacing: .2px; }
        .hero h1 em { font-style: italic; font-weight: 500; color: #e6cc8e; }
        .status { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #dfe6f5; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px); }
        .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade9b; box-shadow: 0 0 0 3px rgba(74,222,155,.2); }
        .pill.loading .dot { background: #e6cc8e; box-shadow: 0 0 0 3px rgba(230,204,142,.2); animation: pulse 1.2s infinite; }
        .pill.err { color: #ffd5d5; border-color: rgba(255,120,120,.4); }
        .pill.err .dot { background: #ff6b6b; box-shadow: 0 0 0 3px rgba(255,107,107,.2); }
        .pill b { color: #fff; font-weight: 700; }
        @keyframes pulse { 50% { opacity: .35; } }

        /* ---------- Layout ---------- */
        .app { min-height: 100vh; display: flex; flex-direction: column; }
        .main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; }
        .search-card { position: relative; margin-top: -36px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
        .search-row { display: flex; gap: 10px; }
        .input-wrap { position: relative; flex: 1; min-width: 0; }
        .i-search { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
        .search-input { width: 100%; height: 54px; padding: 0 14px 0 44px; background: var(--bg-soft); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px; font-size: 16px; font-weight: 500; font-family: var(--sans); outline: none; text-transform: uppercase; letter-spacing: .4px; transition: border-color .15s, box-shadow .15s; }
        .search-input::placeholder { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
        .search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(180,138,60,.16); }
        .scan-btn { flex: none; width: 54px; height: 54px; border: none; border-radius: 14px; cursor: pointer; display: grid; place-items: center; color: #1b1405; background: linear-gradient(145deg, #e3c27c, #b48a3c); box-shadow: 0 8px 18px -8px rgba(180,138,60,.8), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .12s; }
        .scan-btn:active { transform: scale(.95); }
        .info-tip { font-size: 12px; color: var(--muted); margin-top: 10px; padding: 0 4px; }

        .history { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
        .history-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .history-clear { background: none; border: none; color: #d14343; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; padding: 4px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: var(--gold-soft); color: var(--gold-ink); border: 1px solid var(--gold-line); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: .3px; }

        /* ---------- Results ---------- */
        .results { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
        .result-count { font-size: 12px; font-weight: 500; color: var(--muted); padding: 0 6px; letter-spacing: .3px; }
        .empty-message { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }
        .empty-message .ico { display: block; margin: 0 auto 10px; opacity: .45; }

        .card { --accent: #6b7280; --accent-soft: rgba(107,114,128,.12); position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 16px 14px 20px; box-shadow: var(--shadow); animation: rise .35s ease both; }
        .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent); }
        .card.t-muc { --accent: #2c55b8; --accent-soft: rgba(44,85,184,.11); }
        .card.t-phukien { --accent: #b0566e; --accent-soft: rgba(176,86,110,.12); }
        .card.t-may { --accent: #0f7a6f; --accent-soft: rgba(15,122,111,.12); }
        @media (prefers-color-scheme: dark) {
            .card.t-muc { --accent: #7ea2ff; --accent-soft: rgba(126,162,255,.14); }
            .card.t-phukien { --accent: #f08aa4; --accent-soft: rgba(240,138,164,.14); }
            .card.t-may { --accent: #4fd1c0; --accent-soft: rgba(79,209,192,.14); }
        }
        .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .code { font-weight: 700; font-size: 20px; letter-spacing: .4px; word-break: break-all; line-height: 1.2; }
        .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
        .badge-type { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
        .stt { font-size: 11px; color: var(--muted); font-weight: 500; }
        .name-vn { font-size: 14.5px; font-weight: 500; margin-top: 8px; }
        .name-en { font-size: 12px; color: var(--muted); letter-spacing: .5px; margin-top: 2px; text-transform: uppercase; }

        .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
        .fact { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; min-width: 0; }
        .fact .lbl { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
        .fact .val { display: block; font-size: 15px; font-weight: 600; word-break: break-word; }
        .fact.qty { background: linear-gradient(160deg, var(--gold-soft), var(--bg-soft)); border-color: var(--gold-line); }
        .fact.qty .val { font-family: var(--serif); font-size: 30px; line-height: 1.1; font-weight: 700; color: var(--gold-ink); }
        .fact .val.dim { color: var(--muted); font-weight: 500; }

        .sec-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 14px 2px 6px; }
        .wh-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; }
        .wh { text-align: center; padding: 7px 4px; border-radius: 12px; border: 1px dashed var(--line); opacity: .55; }
        .wh .id { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .6px; color: var(--muted); }
        .wh .n { display: block; font-size: 17px; font-weight: 700; }
        .wh.on { opacity: 1; border: 1px solid var(--gold-line); background: var(--gold-soft); }
        .wh.on .n { color: var(--gold-ink); }

        .note { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
        .note svg { flex: none; margin-top: 2px; }
        .foot { display: flex; justify-content: flex-end; margin-top: 10px; }
        .check { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
        .check.warn { background: var(--warn-soft); color: var(--warn); }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ---------- Credit ---------- */
        .credit { text-align: center; margin-top: auto; padding-top: 40px; }
        .credit-line { width: 64px; height: 1px; margin: 0 auto 14px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .credit p { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--muted); letter-spacing: .3px; }
        .credit strong { font-style: normal; font-weight: 700; color: var(--gold); letter-spacing: .6px; }
        .version { margin-top: 6px; font-size: 10px; color: var(--muted); opacity: .7; letter-spacing: 1px; }

        /* ---------- Scanner ---------- */
        .scanner { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
        .scanner.open { display: flex; }
        .scanner video { flex: 1; width: 100%; min-height: 0; object-fit: cover; }
        .scan-frame { position: absolute; left: 7%; right: 7%; top: 50%; height: 26%; transform: translateY(-60%); border: 2px solid #e3c27c; border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(5,9,18,.55); pointer-events: none; overflow: hidden; }
        .scan-frame::after { content: ""; position: absolute; left: 8px; right: 8px; top: 8%; height: 2px; background: linear-gradient(90deg, transparent, #ff5a5a, transparent); animation: sweep 2.2s ease-in-out infinite; }
        @keyframes sweep { 0%, 100% { top: 8%; } 50% { top: 90%; } }
        .scan-msg { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 18px); text-align: center; color: #fff; font-size: 14px; font-weight: 500; padding: 0 20px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
        .scan-debug { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); text-align: center; color: rgba(227,194,124,.85); font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; padding: 0 12px; text-shadow: 0 1px 2px #000; }
        .scan-actions { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; justify-content: center; gap: 10px; padding: 0 14px; }
        .scan-actions button { border: none; border-radius: 999px; padding: 14px 20px; font-size: 14.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
        .btn-close { background: #fff; color: #0f172a; }
        .btn-photo { background: linear-gradient(145deg, #e3c27c, #b48a3c); color: #1b1405; }
        .btn-torch { background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(6px); display: none; }
        .btn-torch.on { background: #facc15; color: #000; }
    </style>
</head>
<body>

<div class="app">
    <header class="hero">
        <div class="hero-inner">
            <div class="eyebrow">Hệ thống kho</div>
            <h1>Tra cứu <em>Item Code</em></h1>
            <div id="status" class="status"><span class="pill loading"><i class="dot"></i>Đang tải dữ liệu từ hệ thống...</span></div>
        </div>
    </header>

    <main class="main">
        <section class="search-card">
            <div class="search-row">
                <div class="input-wrap">
                    <svg class="i-search" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Nhập mã hoặc tên (≥ 4 ký tự)" oninput="onTyping()" autocomplete="off" autocorrect="off" spellcheck="false">
                </div>
                <button class="scan-btn" onclick="openScanner()" aria-label="Quét mã vạch">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 9v6M10.5 9v6M14 9v6M17 9v6"/></svg>
                </button>
            </div>
            <div class="info-tip">Tìm cùng lúc Máy, Mực và Phụ kiện, theo mã hoặc tên. Bỏ qua dấu cách, dấu gạch, dấu tiếng Việt.</div>
            <div id="history" class="history" style="display:none"></div>
        </section>

        <section id="results" class="results">
            <div class="empty-message">Nhập từ 4 ký tự trở lên hoặc bấm nút quét để tra mã vạch.</div>
        </section>

        <footer class="credit">
            <div class="credit-line"></div>
            <p>Designed &amp; Developed by <strong>Nguyễn Hiếu</strong></p>
            <div class="version">PHIÊN BẢN 4</div>
        </footer>
    </main>
</div>

<!-- Màn hình quét mã vạch -->
<div id="scanner" class="scanner">
    <video id="scanVideo" playsinline muted autoplay></video>
    <div class="scan-frame"></div>
    <div id="scanMsg" class="scan-msg">Đang mở camera...</div>
    <div id="scanDebug" class="scan-debug"></div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
    <div class="scan-actions">
        <button id="torchBtn" class="btn-torch" onclick="toggleTorch()">🔦 Đèn</button>
        <button class="btn-photo" onclick="document.getElementById('photoInput').click()">📸 Chụp ảnh</button>
        <button class="btn-close" onclick="closeScanner()">Đóng</button>
    </div>
</div>

<script>
    const DATA_FILE = "data.xlsx";   // tên file Excel đặt cùng thư mục với index.html
    const HISTORY_KEY = "tracuu_history_v1";
    const HISTORY_MAX = 8;

    let allItems = [];
    let historyTimer = null;
    let lastResultCount = 0;

    // ==PURE-START==
    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // Bỏ dấu tiếng Việt: "Bột từ" -> "Bot tu"
    function plain(s) {
        return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
    }
    // Bỏ dấu, bỏ mọi ký tự không phải chữ/số: "a8k-3290" -> "A8K3290"
    function norm(s) {
        return plain(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
    }
    function reEsc(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // Tên cột trong Excel được chuẩn hóa nên đổi hoa/thường, dấu, khoảng trắng vẫn nhận
    function rowMap(row) {
        const m = {};
        Object.keys(row).forEach(k => { m[norm(k)] = row[k]; });
        return m;
    }
    function pick(m, ...names) {
        for (const n of names) {
            const v = m[n];
            if (v !== undefined && v !== null && String(v).trim() !== '') return v;
        }
        return undefined;
    }
    // "Hộp mực in TNP63 (AAE1090) - August 2026" -> "Hộp mực in TNP63"
    function cleanVn(desc, code) {
        let t = String(desc ?? '');
        t = t.replace(/\s*-\s*[A-Za-z]+\s+\d{4}\s*$/, '');
        t = t.replace(new RegExp('\\s*\\(\\s*' + reEsc(code) + '\\s*\\)'), '');
        return t.trim();
    }
    function legacyTab(sheetName) {
        const n = norm(sheetName);
        if (n === 'MUC') return 'Mực';
        if (n === 'PHUKIEN') return 'Phụ kiện';
        return '';
    }

    function buildItems(rows, sheetName) {
        const out = [];
        rows.forEach(row => {
            const m = rowMap(row);
            const code = pick(m, 'ITEMCODE');
            if (code === undefined) return;
            const codeStr = String(code).trim();

            // File mới: DESCRIPTION = tên tiếng Anh, ITEM DESCRIPTION = tên tiếng Việt.
            // File cũ (có cột kk): ngược lại. Hỗ trợ cả hai.
            const legacy = m['DESCRIPTION'] === undefined && m['KK'] !== undefined;
            const en = legacy ? pick(m, 'ITEMDESCRIPTION') : pick(m, 'DESCRIPTION');
            const vnRaw = legacy ? pick(m, 'KK') : pick(m, 'ITEMDESCRIPTION');
            const vn = cleanVn(vnRaw, codeStr);
            const loai = String(pick(m, 'LOAI') || legacyTab(sheetName) || '').trim();

            const wh = [];
            Object.keys(m).forEach(k => {
                const mm = /^KHO(\d+)$/.exec(k);
                if (mm) wh.push({ id: mm[1], qty: Number(m[k]) || 0 });
            });
            wh.sort((a, b) => a.id.localeCompare(b.id));

            out.push({
                tab: loai,
                tabKey: norm(loai),
                stt: pick(m, 'STT', 'NO'),
                code: codeStr,
                en: String(en ?? ''),
                vn,
                coo: pick(m, 'COO'),
                qty: pick(m, 'QTYTONG', 'QTY', 'QUANTITY'),
                khay: pick(m, 'KHAY'),
                label: pick(m, 'NHANTEM', 'REMARK'),
                wh,
                note: pick(m, 'PHANLOAIKHOGHICHUNHAN'),
                check: pick(m, 'KIEMTRA'),
                nCode: norm(codeStr),
                nText: norm(codeStr + ' ' + (en ?? '') + ' ' + vn)
            });
        });
        return out;
    }

    function search(keywordRaw) {
        const tokens = String(keywordRaw).toUpperCase().split(/[\s\-_\/.,]+/).map(norm).filter(Boolean);
        const joined = tokens.join('');
        if (!joined) return [];

        let found = allItems.filter(it => tokens.every(t => it.nText.includes(t)));

        // Dự phòng: mã vạch quét ra có thêm tiền tố/hậu tố quanh ITEM CODE
        if (found.length === 0 && joined.length >= 5) {
            found = allItems.filter(it => it.nCode.length >= 5 && joined.includes(it.nCode));
        }

        const score = it => it.nCode === joined ? 0 : it.nCode.startsWith(joined) ? 1 : it.nCode.includes(joined) ? 2 : 3;
        return found.map(it => ({ it, s: score(it) })).sort((a, b) => a.s - b.s).map(x => x.it);
    }
    // ==PURE-END==

    window.onload = function () {
        renderHistory();
        fetchExcelFromServer();
    };

    // ---------- Tải dữ liệu ----------
    function setStatus(html) { document.getElementById('status').innerHTML = html; }

    function fetchExcelFromServer() {
        fetch(DATA_FILE + '?v=' + Math.random())
            .then(res => {
                if (!res.ok) throw new Error("Không tìm thấy file " + DATA_FILE);
                return res.arrayBuffer();
            })
            .then(ab => {
                const workbook = XLSX.read(new Uint8Array(ab), { type: 'array' });
                allItems = [];
                workbook.SheetNames.forEach(sheetName => {
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                    allItems = allItems.concat(buildItems(rows, sheetName));
                });

                const counts = new Map();
                allItems.forEach(it => {
                    const k = it.tab || 'Khác';
                    counts.set(k, (counts.get(k) || 0) + 1);
                });
                let html = `<span class="pill"><i class="dot"></i>Sẵn sàng · <b>${allItems.length}</b> mã</span>`;
                counts.forEach((n, k) => { html += `<span class="pill">${esc(k)} <b>${n}</b></span>`; });
                setStatus(html);
                handleSearch();
            })
            .catch(err => {
                setStatus(`<span class="pill err"><i class="dot"></i>Không tải được file dữ liệu (${esc(DATA_FILE)})</span>`);
                console.error(err);
            });
    }

    // ---------- Tìm kiếm ----------
    function onTyping() {
        handleSearch();
        // Lưu lịch sử sau khi ngừng gõ ~1 giây và có kết quả
        clearTimeout(historyTimer);
        historyTimer = setTimeout(() => {
            const kw = document.getElementById('searchInput').value.trim().toUpperCase();
            if (norm(kw).length >= 4 && lastResultCount > 0) saveHistory(kw);
        }, 1000);
    }

    const SEARCH_ICON = `<svg class="ico" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;
    const NOTE_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

    function show(v) { return v === undefined || v === null || String(v).trim() === '' ? null : String(v); }

    function cardHtml(it) {
        const typeClass = it.tabKey === 'MUC' ? 't-muc' : it.tabKey === 'PHUKIEN' ? 't-phukien' : it.tabKey === 'MAY' ? 't-may' : '';
        const dash = `<span class="val dim">—</span>`;
        const val = (v) => show(v) !== null ? `<span class="val">${esc(v)}</span>` : dash;

        const checkOk = show(it.check) !== null && norm(it.check) === 'OK';
        const checkHtml = show(it.check) !== null
            ? `<div class="foot"><span class="check ${checkOk ? '' : 'warn'}">${checkOk ? '✓' : '!'} Kiểm tra: ${esc(it.check)}</span></div>` : '';

        const whHtml = it.wh.length ? `
            <div class="sec-label">Tồn theo kho</div>
            <div class="wh-row">${it.wh.map(w => `<div class="wh ${w.qty > 0 ? 'on' : ''}"><span class="id">${esc(w.id)}</span><span class="n">${esc(w.qty)}</span></div>`).join('')}</div>` : '';

        return `
            <article class="card ${typeClass}">
                <div class="c-head">
                    <span class="code">${esc(it.code)}</span>
                    <span class="tags">
                        ${it.tab ? `<span class="badge-type">${esc(it.tab.toUpperCase())}</span>` : ''}
                        ${show(it.stt) !== null ? `<span class="stt">STT ${esc(it.stt)}</span>` : ''}
                    </span>
                </div>
                ${it.vn ? `<div class="name-vn">${esc(it.vn)}</div>` : ''}
                ${it.en ? `<div class="name-en">${esc(it.en)}</div>` : ''}
                <div class="facts">
                    <div class="fact qty"><span class="lbl">Số lượng (Qty)</span>${show(it.qty) !== null ? `<span class="val">${esc(it.qty)}</span>` : `<span class="val">0</span>`}</div>
                    <div class="fact"><span class="lbl">Vị trí Khay</span>${val(it.khay)}</div>
                    <div class="fact"><span class="lbl">Nhãn tem</span>${val(it.label)}</div>
                    <div class="fact"><span class="lbl">Xuất xứ</span>${val(it.coo)}</div>
                </div>
                ${whHtml}
                ${show(it.note) !== null ? `<div class="note">${NOTE_ICON}<span>${esc(it.note)}</span></div>` : ''}
                ${checkHtml}
            </article>`;
    }

    function handleSearch(force) {
        const keyword = document.getElementById('searchInput').value.trim().toUpperCase();
        const box = document.getElementById('results');
        lastResultCount = 0;

        if (!force && norm(keyword).length < 4) {
            box.innerHTML = `<div class="empty-message">Nhập từ 4 ký tự trở lên hoặc bấm nút quét để tra mã vạch.</div>`;
            renderHistory();
            return;
        }
        document.getElementById('history').style.display = 'none';

        const filtered = search(keyword);
        lastResultCount = filtered.length;

        if (filtered.length === 0) {
            box.innerHTML = `<div class="empty-message">${SEARCH_ICON}Không tìm thấy mã nào chứa "${esc(keyword)}"</div>`;
            return;
        }

        box.innerHTML = `<div class="result-count">Tìm thấy ${filtered.length} kết quả</div>` + filtered.map(cardHtml).join('');
    }

    // ---------- Lịch sử tra cứu ----------
    function loadHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
    }
    function saveHistory(kw) {
        try {
            let list = loadHistory().filter(x => norm(x) !== norm(kw));
            list.unshift(kw);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX)));
        } catch (e) { /* bỏ qua nếu trình duyệt chặn lưu */ }
    }
    function clearHistory() {
        try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
        renderHistory();
    }
    function renderHistory() {
        const el = document.getElementById('history');
        const list = loadHistory();
        if (!list.length) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.innerHTML = `
            <div class="history-head"><span>Tra gần đây</span><button class="history-clear" onclick="clearHistory()">Xóa</button></div>
            <div class="chips">${list.map((x, i) => `<button class="chip" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
        el.querySelectorAll('.chip').forEach(btn => {
            btn.onclick = () => {
                const kw = list[btn.dataset.i];
                document.getElementById('searchInput').value = kw;
                handleSearch(true);
                saveHistory(kw);
            };
        });
    }

    // ---------- Quét mã vạch bằng camera ----------
    // Thùng hàng có nhiều mã vạch (UPC, tem phụ, Part Number...). Web đọc tất cả,
    // chỉ nhận mã nào có trong danh sách ITEM CODE, các mã còn lại bỏ qua.
    const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    const NATIVE_FORMATS = ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar'];
    const VIDEO_CONSTRAINTS = { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } };

    let scanning = false, scanStream = null, scanTimer = null, torchOn = false;
    let nativeDetector = null, zxReader = null;
    const scanCanvas = document.createElement('canvas');
    const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
    const bandCanvas = document.createElement('canvas');
    const bandCtx = bandCanvas.getContext('2d', { willReadFrequently: true });
    let lastMiss = '', lastMissAt = 0;
    let frameCount = 0, lastRead = '', photoBusy = false;

    async function initEngine() {
        if (nativeDetector || zxReader) return;
        if ('BarcodeDetector' in window) {
            try {
                const supported = await BarcodeDetector.getSupportedFormats();
                const formats = NATIVE_FORMATS.filter(f => supported.includes(f));
                if (formats.length) nativeDetector = new BarcodeDetector({ formats });
            } catch (e) { nativeDetector = null; }
        }
        if (!nativeDetector) {
            await loadZxing();
            const F = ZXing.BarcodeFormat;
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR]);
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            zxReader = new ZXing.MultiFormatReader();
            zxReader.setHints(hints);
        }
    }

    function updateDebug(video) {
        document.getElementById('scanDebug').textContent =
            `v4 · ${nativeDetector ? 'BarcodeDetector' : 'ZXing'} · ${video.videoWidth}x${video.videoHeight} · ${frameCount} khung · đọc: ${lastRead || 'chưa thấy mã nào'}`;
    }

    function setScanMsg(t) { document.getElementById('scanMsg').textContent = t; }

    function loadZxing() {
        return new Promise((resolve, reject) => {
            if (window.ZXing) return resolve();
            const s = document.createElement('script');
            s.src = ZXING_URL;
            s.onload = resolve;
            s.onerror = () => reject(new Error('Không tải được bộ quét'));
            document.head.appendChild(s);
        });
    }

    async function openScanner() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('Không mở được camera. Web cần chạy bằng HTTPS (không mở trực tiếp file).');
            return;
        }
        document.getElementById('scanner').classList.add('open');
        document.getElementById('torchBtn').style.display = 'none';
        setScanMsg('Đang mở camera...');
        scanning = true;
        nativeDetector = null;
        zxReader = null;
        lastMiss = '';
        frameCount = 0;
        lastRead = '';

        try {
            await initEngine();
            if (!scanning) return;

            const video = document.getElementById('scanVideo');
            const stream = await navigator.mediaDevices.getUserMedia({ video: VIDEO_CONSTRAINTS, audio: false });
            if (!scanning) { stream.getTracks().forEach(t => t.stop()); return; }
            scanStream = stream;
            video.srcObject = stream;
            await video.play();
            setupTorch();
            tryContinuousFocus();
            setScanMsg('Đưa mã vạch (Part Number) vào khung xanh');
            startLoop(video);
        } catch (e) {
            console.error(e);
            const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
            setScanMsg(denied ? 'Chưa được cấp quyền camera. Hãy cho phép camera trong cài đặt trình duyệt rồi thử lại.'
                              : 'Không mở được camera: ' + (e.message || e.name));
        }
    }

    function startLoop(video) {
        let busy = false;
        scanTimer = setInterval(async () => {
            if (busy || photoBusy || !scanning || video.readyState < 2 || !video.videoWidth) return;
            busy = true;
            try {
                const texts = await readFrame(video);
                frameCount++;
                if (texts.length) lastRead = texts[0];
                updateDebug(video);
                if (scanning) handleTexts(texts);
            } catch (e) { console.error(e); }
            busy = false;
        }, 120);
    }

    // Mực in xanh trên thùng giấy nâu rất khó đọc. Kênh màu ĐỎ làm vạch xanh thành đen,
    // nền giấy nâu thành sáng, nên chuyển ảnh sang xám theo kênh đỏ rồi tăng tương phản.
    function enhance(ctx, w, h) {
        const img = ctx.getImageData(0, 0, w, h), d = img.data, n = w * h;
        const hist = new Uint32Array(256);
        for (let i = 0; i < n; i++) hist[d[i * 4]]++;
        const cut = n * 0.02;
        let lo = 0, hi = 255, acc = 0;
        for (; lo < 255; lo++) { acc += hist[lo]; if (acc > cut) break; }
        acc = 0;
        for (; hi > 0; hi--) { acc += hist[hi]; if (acc > cut) break; }
        if (hi - lo < 20) { lo = 0; hi = 255; }
        const k = 255 / (hi - lo);
        for (let i = 0; i < n; i++) {
            let v = (d[i * 4] - lo) * k;
            v = v < 0 ? 0 : v > 255 ? 255 : v;
            d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
        }
        ctx.putImageData(img, 0, 0);
    }

    async function readFrame(video) {
        const vw = video.videoWidth, vh = video.videoHeight;
        const s = Math.min(1, 1600 / vw);
        const w = Math.round(vw * s), h = Math.round(vh * s);
        if (scanCanvas.width !== w || scanCanvas.height !== h) { scanCanvas.width = w; scanCanvas.height = h; }
        scanCtx.drawImage(video, 0, 0, w, h);
        enhance(scanCtx, w, h);

        if (nativeDetector) {
            let found = await nativeDetector.detect(scanCanvas);
            if (!found.length || !found.some(c => resolveScan(c.rawValue))) {
                const raw = await nativeDetector.detect(video);   // thử thêm ảnh gốc
                found = found.concat(raw);
            }
            return found.map(c => c.rawValue);
        }
        return zxDecode(scanCanvas, w, h);
    }

    function zxTry(canvas) {
        try {
            const lum = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
            const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
            return zxReader.decode(bmp).getText();
        } catch (e) { return null; }
    }

    // ZXing chỉ trả 1 mã mỗi lần, nên đọc cả khung rồi đọc thêm 3 dải ngang
    // để bắt được các mã vạch khác nhau trên cùng thùng.
    function zxDecode(canvas, w, h) {
        const out = [];
        let t = zxTry(canvas);
        if (t) { out.push(t); if (resolveScan(t)) return out; }
        for (const [a, b] of [[0, 0.45], [0.275, 0.725], [0.55, 1]]) {
            const y = Math.round(h * a), bh = Math.round(h * (b - a));
            if (bandCanvas.width !== w || bandCanvas.height !== bh) { bandCanvas.width = w; bandCanvas.height = bh; }
            bandCtx.drawImage(canvas, 0, y, w, bh, 0, 0, w, bh);
            t = zxTry(bandCanvas);
            if (t) { out.push(t); if (resolveScan(t)) break; }
        }
        return out;
    }

    // Chỉ nhận mã có trong danh sách. Part Number (1P) có tiền tố "1P" -> bỏ đi.
    function resolveScan(text) {
        const t = String(text || '').trim();
        if (!t) return null;
        if (!allItems.length) return t;  // dữ liệu chưa tải xong thì nhận luôn
        if (/^1P/i.test(t) && search(t.slice(2)).length) return t.slice(2);
        if (search(t).length) return t;
        return null;
    }

    function handleTexts(texts) {
        for (const raw of texts) {
            const code = resolveScan(raw);
            if (code) { onScanned(code); return; }
        }
        if (texts.length) {
            const t = texts[0], now = Date.now();
            if (t !== lastMiss || now - lastMissAt > 2500) {
                lastMiss = t; lastMissAt = now;
                setScanMsg(`Đọc được "${t}" nhưng không có trong danh sách. Hãy quét mã vạch Part Number khác trên thùng.`);
            }
        }
    }

    function getTrack() { return scanStream && scanStream.getVideoTracks()[0]; }

    function setupTorch() {
        const track = getTrack();
        const caps = track && track.getCapabilities ? track.getCapabilities() : {};
        const btn = document.getElementById('torchBtn');
        torchOn = false;
        btn.classList.remove('on');
        btn.style.display = caps.torch ? 'block' : 'none';
    }

    async function toggleTorch() {
        const track = getTrack();
        if (!track) return;
        try {
            torchOn = !torchOn;
            await track.applyConstraints({ advanced: [{ torch: torchOn }] });
            document.getElementById('torchBtn').classList.toggle('on', torchOn);
        } catch (e) { torchOn = false; }
    }

    function tryContinuousFocus() {
        const track = getTrack();
        if (track && track.applyConstraints) {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }
    }

    function beep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = 1000;
            osc.connect(ctx.destination);
            osc.start();
            setTimeout(() => { osc.stop(); ctx.close(); }, 120);
        } catch (e) {}
        if (navigator.vibrate) navigator.vibrate(80);
    }

    function onScanned(code) {
        if (!scanning) return;
        finishScan(code);
    }

    function finishScan(code) {
        beep();
        closeScanner();
        document.getElementById('searchInput').value = code.toUpperCase();
        handleSearch(true);
        saveHistory(code.toUpperCase());
    }

    // Chụp ảnh tĩnh: ảnh từ app camera nét và to hơn khung hình video nên dễ đọc hơn.
    async function decodeStill(bmp) {
        const out = [];
        for (const maxSide of [2200, 1400]) {
            const sc = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
            const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
            for (const enh of [true, false]) {
                if (scanCanvas.width !== w || scanCanvas.height !== h) { scanCanvas.width = w; scanCanvas.height = h; }
                scanCtx.drawImage(bmp, 0, 0, w, h);
                if (enh) enhance(scanCtx, w, h);
                const texts = nativeDetector
                    ? (await nativeDetector.detect(scanCanvas)).map(c => c.rawValue)
                    : zxDecode(scanCanvas, w, h);
                for (const t of texts) if (!out.includes(t)) out.push(t);
                if (out.some(t => resolveScan(t))) return out;
            }
        }
        return out;
    }

    async function handlePhoto(input) {
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        photoBusy = true;
        setScanMsg('Đang đọc ảnh...');
        document.getElementById('results').innerHTML = `<div class="empty-message">Đang đọc ảnh...</div>`;
        let msg = '';
        try {
            await initEngine();
            const bmp = await createImageBitmap(file);
            const texts = await decodeStill(bmp);
            for (const raw of texts) {
                const code = resolveScan(raw);
                if (code) { photoBusy = false; finishScan(code); return; }
            }
            msg = texts.length
                ? `Đọc được "${texts[0]}" nhưng không có trong danh sách. Hãy chụp mã vạch Part Number.`
                : 'Không đọc được mã vạch trong ảnh. Chụp gần hơn, đủ sáng, thật nét rồi thử lại.';
        } catch (e) {
            console.error(e);
            msg = 'Không đọc được ảnh: ' + (e.message || e.name);
        }
        photoBusy = false;
        setScanMsg(msg);
        if (!scanning) document.getElementById('results').innerHTML = `<div class="empty-message">❌ ${esc(msg)}</div>`;
    }

    function closeScanner() {
        scanning = false;
        clearInterval(scanTimer);
        scanTimer = null;
        nativeDetector = null;
        zxReader = null;
        if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
        document.getElementById('scanVideo').srcObject = null;
        document.getElementById('scanner').classList.remove('open');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape' && scanning) closeScanner(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && scanning) closeScanner(); });
</script>
</body>
</html>
