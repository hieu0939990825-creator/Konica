<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a63b0">
    <title>Tra Cứu ITEM CODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #edf7fc; --bg-soft: #f7fcff; --surface: #ffffff; --ink: #07142e; --muted: #4a5f7a; --gold-text: #075a99;
            --line: #d2e8f1; --gold: #0070b8; --gold-soft: #e0f5fb; --gold-line: #9fdcee; --gold-ink: #04388a;
            --navy: #0a1a66; --ok: #0f7a4d; --ok-soft: #e3f4ec; --warn: #a15c07; --warn-soft: #fdf0d8;
            --shadow: 0 1px 2px rgba(20,24,38,.04), 0 10px 28px -10px rgba(20,24,38,.16);
            --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); }
        body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        button { font-family: inherit; }

        /* ---------- Hero ---------- */
        .hero {
            background:
                radial-gradient(70% 90% at 92% -10%, rgba(0,205,232,.50) 0%, transparent 60%),
                radial-gradient(60% 80% at 0% 115%, rgba(120,226,242,.22) 0%, transparent 62%),
                linear-gradient(165deg, #0b78c4 0%, #0457a8 48%, #033d8c 100%);
            border-radius: 0 0 30px 30px;
            box-shadow: 0 14px 30px -18px rgba(3,61,140,.7);
            padding: calc(env(safe-area-inset-top, 0px) + 26px) 20px 66px;
            text-align: center;
        }
        .hero-inner { max-width: 560px; margin: 0 auto; }
        .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #a0eaf8; margin-bottom: 8px; }
        .hero h1 { font-family: var(--serif); font-weight: 700; font-size: 31px; line-height: 1.15; color: #fff; letter-spacing: .2px; text-shadow: 0 2px 12px rgba(3,40,100,.35); }
        .hero h1 em { font-style: italic; font-weight: 500; color: #8eeaf8; }
        .status { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: #e6f6fd; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(4px); }
        .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #5df0c0; box-shadow: 0 0 0 3px rgba(93,240,192,.28); }
        .pill.loading .dot { background: #ffd36b; box-shadow: 0 0 0 3px rgba(255,211,107,.28); animation: pulse 1.2s infinite; }
        .pill.err { color: #ffe3e3; border-color: rgba(255,150,150,.6); background: rgba(220,60,60,.28); }
        .pill.err .dot { background: #ff8a8a; box-shadow: 0 0 0 3px rgba(255,138,138,.3); }
        .pill b { color: #fff; font-weight: 700; }
        @keyframes pulse { 50% { opacity: .35; } }

        /* ---------- Layout ---------- */
        .app { min-height: 100vh; display: flex; flex-direction: column; }
        .main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; }
        .search-card { position: relative; margin-top: -36px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: 0 18px 36px -14px rgba(3,61,140,.5), 0 2px 4px rgba(3,61,140,.06); }
        .search-row { display: flex; gap: 10px; }
        .input-wrap { position: relative; flex: 1; min-width: 0; }
        .i-search { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
        .search-input { width: 100%; height: 54px; padding: 0 14px 0 44px; background: var(--bg-soft); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px; font-size: 16px; font-weight: 500; font-family: var(--sans); outline: none; text-transform: uppercase; letter-spacing: .4px; transition: border-color .15s, box-shadow .15s; }
        .search-input::placeholder { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
        .search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(0,112,184,.18); }
        .scan-btn { flex: none; width: 54px; height: 54px; border: none; border-radius: 14px; cursor: pointer; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #00b4d8, #0070b8); box-shadow: 0 8px 18px -8px rgba(0,112,184,.75), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .12s; }
        .scan-btn:active { transform: scale(.95); }
        .info-tip { font-size: 12.5px; color: var(--muted); margin-top: 10px; padding: 0 4px; }

        .history { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
        .history-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .history-clear { background: none; border: none; color: #d14343; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; cursor: pointer; padding: 4px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: #e0f2fb; color: #06306f; border: 1px solid var(--gold-line); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: .3px; }

        /* ---------- Results ---------- */
        .results { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
        .result-count { font-size: 12.5px; font-weight: 600; color: #0b4f8f; padding: 0 6px; letter-spacing: .3px; }
        .empty-message { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }
        .empty-message .ico { display: block; margin: 0 auto 10px; opacity: .45; }

        .card { --accent: #6b7280; --accent-soft: rgba(107,114,128,.12); position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 16px 14px 20px; box-shadow: var(--shadow); animation: rise .35s ease both; }
        .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent); }
        .card.t-muc { --accent: #1b8a6b; --accent-soft: rgba(27,138,107,.11); }
        .card.t-phukien { --accent: #c2682f; --accent-soft: rgba(194,104,47,.12); }
        .card.t-may { --accent: #7a4fa0; --accent-soft: rgba(122,79,160,.11); }
        .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .code { color: #06306f; font-weight: 700; font-size: 20px; letter-spacing: .4px; word-break: break-all; line-height: 1.2; }
        .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
        .badge-type { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
        .stt { font-size: 11px; color: var(--muted); font-weight: 500; }
        .name-en { font-size: 19px; font-weight: 700; line-height: 1.3; letter-spacing: .3px; margin-top: 10px; text-transform: uppercase; color: var(--ink); }
        .name-vn { font-size: 16.5px; font-weight: 500; line-height: 1.4; margin-top: 5px; color: #2a3d55; }

        .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
        .fact { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; min-width: 0; }
        .fact .lbl { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
        .fact .val { display: block; font-size: 16px; font-weight: 600; word-break: break-word; }
        .fact.qty { background: linear-gradient(160deg, var(--gold-soft), var(--bg-soft)); border-color: var(--gold-line); }
        .fact.qty .val { font-family: var(--serif); font-size: 30px; line-height: 1.1; font-weight: 700; color: var(--gold-ink); }
        .fact .val.dim { color: var(--muted); font-weight: 500; }

        .sec-label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 14px 2px 6px; }
        .wh-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 6px; }
        .wh { text-align: center; padding: 7px 4px; border-radius: 12px; border: 1px dashed var(--line); opacity: .55; }
        .wh .id { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .6px; color: var(--muted); }
        .wh .n { display: block; font-size: 17px; font-weight: 700; }
        .wh.on { opacity: 1; border: 1px solid var(--gold-line); background: var(--gold-soft); }
        .wh.on .n { color: var(--gold-ink); }

        .note { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
        .note svg { flex: none; margin-top: 2px; }
        .foot { display: flex; justify-content: flex-end; margin-top: 10px; }
        .check { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
        .check.warn { background: var(--warn-soft); color: var(--warn); }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ---------- Credit ---------- */
        .credit { text-align: center; margin-top: auto; padding-top: 40px; }
        .credit-line { width: 64px; height: 1px; margin: 0 auto 14px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .credit p { font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--muted); letter-spacing: .3px; }
        .credit strong { font-style: normal; font-weight: 700; color: var(--gold-text); letter-spacing: .6px; }
        .version { margin-top: 6px; font-size: 10px; color: var(--muted); opacity: .7; letter-spacing: 1px; }

        /* ---------- Scanner ---------- */
        .scanner { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
        .scanner.open { display: flex; }
        .scanner video { flex: 1; width: 100%; min-height: 0; object-fit: cover; }
        .scan-frame { position: absolute; left: 7%; right: 7%; top: 50%; height: 26%; transform: translateY(-60%); border: 2px solid #78e2f2; border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(5,9,18,.55); pointer-events: none; overflow: hidden; }
        .scan-frame::before { content: ""; position: absolute; left: 0; right: 0; top: 27.5%; height: 45%; background: rgba(255,77,77,.12); border-top: 1px dashed rgba(255,77,77,.55); border-bottom: 1px dashed rgba(255,77,77,.55); } /* vùng quét thật sự: khớp LINE_BAND trong JS (45%) */
        .scan-frame::after { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; margin-top: -1px; background: linear-gradient(90deg, transparent, #ff4d4d 10%, #ff4d4d 90%, transparent); box-shadow: 0 0 6px rgba(255,77,77,.6); }
        .scan-msg { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 18px); text-align: center; color: #fff; font-size: 14px; font-weight: 500; padding: 0 20px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
        .scan-debug { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); text-align: center; color: rgba(120,226,242,.9); font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; padding: 0 12px; text-shadow: 0 1px 2px #000; }
        .scan-actions { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; justify-content: center; gap: 10px; padding: 0 14px; }
        .scan-actions button { border: none; border-radius: 999px; padding: 14px 20px; font-size: 14.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
        .btn-close { background: #fff; color: #0f172a; }
        .btn-photo { background: linear-gradient(145deg, #00b4d8, #0070b8); color: #fff; }
        .btn-torch { background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(6px); display: none; }
        .btn-torch.on { background: #facc15; color: #000; }

        /* ---------- DSV theme (v5) ---------- */
        :root { --bg:#f3f6fb; --bg-soft:#f8fafd; --ink:#0b1b3a; --muted:#5a6b88; --line:#d5deec; --gold:#0e2861; --gold-soft:#e6edf9; --gold-line:#b9c9e6; --gold-ink:#0e2861; --gold-text:#0e2861; --navy:#0e2861; --serif:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        .hero { background:#fff; border-radius:0; box-shadow:none; border-bottom:3px solid var(--navy); padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; text-align:left; }
        .hero-inner { max-width:560px; margin:0 auto; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:8px 14px; }
        .logo { height:46px; width:auto; display:block; }
        .hero-title { justify-self:end; font-size:14px; font-weight:600; color:var(--navy); letter-spacing:.2px; }
        .status { grid-column:1 / -1; margin:0; justify-content:flex-start; }
        .pill { color:#33518a; background:#eef3fb; border:1px solid var(--line); backdrop-filter:none; }
        .pill b { color:var(--navy); }
        .pill.err { color:#a32d2d; background:#fcebeb; border-color:#f09595; }
        .search-card { margin-top:14px; border-radius:12px; box-shadow:0 1px 3px rgba(14,40,97,.10); }
        .search-input { border-radius:8px; } .search-input:focus { box-shadow:0 0 0 3px rgba(14,40,97,.16); }
        .scan-btn { background:var(--navy); border-radius:8px; box-shadow:none; }
        .btn-photo { background:var(--navy); }
        .chip { background:var(--gold-soft); color:var(--navy); border-color:var(--gold-line); }
        .result-count { color:var(--navy); }
        .card { border-radius:12px; box-shadow:0 1px 3px rgba(14,40,97,.10); }
        .card::before { width:4px; }
        .hl { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
        .hl-box { border-radius:10px; padding:10px 12px; min-width:0; }
        .hl-box .lbl { display:block; font-size:11.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
        .hl-box .val { display:block; font-size:34px; font-weight:700; line-height:1.1; word-break:break-word; }
        .hl-box .val.dim { font-weight:500; opacity:.6; }
        .b-stt { background:var(--gold-soft); color:var(--navy); } .b-stt .lbl { color:#33518a; }
        .b-khay { background:var(--navy); color:#fff; } .b-khay .lbl { color:#9fc3ff; }
        .facts { margin-top:8px; }
        .fact { border-radius:10px; }
        .fact.qty { background:var(--bg-soft); border-color:var(--line); }
        .fact.qty .val { font-family:var(--sans); font-size:18px; font-weight:600; color:var(--ink); }
        .credit-line { background:var(--gold-line); }
        .credit p { font-family:var(--sans); font-style:normal; font-size:13px; }
    </style>
</head>

    <header class="hero">

<script>
    const DATA_FILE = "data.xlsx";   // tên file Excel đặt cùng thư mục với index.html
    const HISTORY_KEY = "tracuu_history_v1";
    const HISTORY_MAX = 8;

    let allItems = [];
    let historyTimer = null;
    let lastResultCount = 0;

    // ==PURE-START==
    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // Bỏ dấu tiếng Việt: "Bột từ" -> "Bot tu"
    function plain(s) {
        return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
    }
    // Bỏ dấu, bỏ mọi ký tự không phải chữ/số: "a8k-3290" -> "A8K3290"
    function norm(s) {
        return plain(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
    }
    function reEsc(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    // Tên cột trong Excel được chuẩn hóa nên đổi hoa/thường, dấu, khoảng trắng vẫn nhận
    function rowMap(row) {
        const m = {};
        Object.keys(row).forEach(k => { m[norm(k)] = row[k]; });
        return m;
    }
    function pick(m, ...names) {
        for (const n of names) {
            const v = m[n];
            if (v !== undefined && v !== null && String(v).trim() !== '') return v;
        }
        return undefined;
    }
    // "Hộp mực in TNP63 (AAE1090) - August 2026" -> "Hộp mực in TNP63"
    function cleanVn(desc, code) {
        let t = String(desc ?? '');
        t = t.replace(/\s*-\s*[A-Za-z]+\s+\d{4}\s*$/, '');
        t = t.replace(new RegExp('\\s*\\(\\s*' + reEsc(code) + '\\s*\\)'), '');
        return t.trim();
    }
    function legacyTab(sheetName) {
        const n = norm(sheetName);
        if (n === 'MUC') return 'Mực';
        if (n === 'PHUKIEN') return 'Phụ kiện';
        return '';
    }

    function buildItems(rows, sheetName) {
        const out = [];
        rows.forEach(row => {
            const m = rowMap(row);
            const code = pick(m, 'ITEMCODE');
            if (code === undefined) return;
            const codeStr = String(code).trim();

            // File mới: DESCRIPTION = tên tiếng Anh, ITEM DESCRIPTION = tên tiếng Việt.
            // File cũ (có cột kk): ngược lại. Hỗ trợ cả hai.
            const legacy = m['DESCRIPTION'] === undefined && m['KK'] !== undefined;
            const en = legacy ? pick(m, 'ITEMDESCRIPTION') : pick(m, 'DESCRIPTION');
            const vnRaw = legacy ? pick(m, 'KK') : pick(m, 'ITEMDESCRIPTION');
            const vn = cleanVn(vnRaw, codeStr);
            const loai = String(pick(m, 'LOAI') || legacyTab(sheetName) || '').trim();

            const wh = [];
            Object.keys(m).forEach(k => {
                const mm = /^KHO(\d+)$/.exec(k);
                if (mm) wh.push({ id: mm[1], qty: Number(m[k]) || 0 });
            });
            wh.sort((a, b) => a.id.localeCompare(b.id));

            out.push({
                tab: loai,
                tabKey: norm(loai),
                stt: pick(m, 'STT', 'NO'),
                code: codeStr,
                en: String(en ?? ''),
                vn,
                coo: pick(m, 'COO'),
                qty: pick(m, 'QTYTONG', 'QTY', 'QUANTITY'),
                khay: pick(m, 'KHAY'),
                label: pick(m, 'NHANTEM', 'REMARK'),
                wh,
                note: pick(m, 'PHANLOAIKHOGHICHUNHAN'),
                check: pick(m, 'KIEMTRA'),
                nCode: norm(codeStr),
                nText: norm(codeStr + ' ' + (en ?? '') + ' ' + vn)
            });
        });
        return out;
    }

    function search(keywordRaw) {
        const tokens = String(keywordRaw).toUpperCase().split(/[\s\-_\/.,]+/).map(norm).filter(Boolean);
        const joined = tokens.join('');
        if (!joined) return [];

        let found = allItems.filter(it => tokens.every(t => it.nText.includes(t)));

        // Dự phòng: mã vạch quét ra có thêm tiền tố/hậu tố quanh ITEM CODE
        if (found.length === 0 && joined.length >= 5) {
            found = allItems.filter(it => it.nCode.length >= 5 && joined.includes(it.nCode));
        }

        const score = it => it.nCode === joined ? 0 : it.nCode.startsWith(joined) ? 1 : it.nCode.includes(joined) ? 2 : 3;
        return found.map(it => ({ it, s: score(it) })).sort((a, b) => a.s - b.s).map(x => x.it);
    }
    // ==PURE-END==

    window.onload = function () {
        renderHistory();
        fetchExcelFromServer();
    };

    // ---------- Tải dữ liệu ----------
    function setStatus(html) { document.getElementById('status').innerHTML = html; }

    function fetchExcelFromServer() {
        fetch(DATA_FILE + '?v=' + Math.random())
            .then(res => {
                if (!res.ok) throw new Error("Không tìm thấy file " + DATA_FILE);
                return res.arrayBuffer();
            })
            .then(ab => {
                const workbook = XLSX.read(new Uint8Array(ab), { type: 'array' });
                allItems = [];
                workbook.SheetNames.forEach(sheetName => {
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                    allItems = allItems.concat(buildItems(rows, sheetName));
                });

                const counts = new Map();
                allItems.forEach(it => {
                    const k = it.tab || 'Khác';
                    counts.set(k, (counts.get(k) || 0) + 1);
                });
                let html = `<span class="pill"><i class="dot"></i>Sẵn sàng · <b>${allItems.length}</b> mã</span>`;
                counts.forEach((n, k) => { html += `<span class="pill">${esc(k)} <b>${n}</b></span>`; });
                setStatus(html);
                handleSearch();
            })
            .catch(err => {
                setStatus(`<span class="pill err"><i class="dot"></i>Không tải được file dữ liệu (${esc(DATA_FILE)})</span>`);
                console.error(err);
            });
    }

    // ---------- Tìm kiếm ----------
    function onTyping() {
        handleSearch();
        // Lưu lịch sử sau khi ngừng gõ ~1 giây và có kết quả
        clearTimeout(historyTimer);
        historyTimer = setTimeout(() => {
            const kw = document.getElementById('searchInput').value.trim().toUpperCase();
            if (norm(kw).length >= 4 && lastResultCount > 0) saveHistory(kw);
        }, 1000);
    }

    const SEARCH_ICON = `<svg class="ico" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;
    const NOTE_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

    function show(v) { return v === undefined || v === null || String(v).trim() === '' ? null : String(v); }

    function cardHtml(it) {
        const typeClass = it.tabKey === 'MUC' ? 't-muc' : it.tabKey === 'PHUKIEN' ? 't-phukien' : it.tabKey === 'MAY' ? 't-may' : '';
        const dash = `<span class="val dim">—</span>`;
        const val = (v) => show(v) !== null ? `<span class="val">${esc(v)}</span>` : dash;

        const checkOk = show(it.check) !== null && norm(it.check) === 'OK';
        const checkHtml = show(it.check) !== null
            ? `<div class="foot"><span class="check ${checkOk ? '' : 'warn'}">${checkOk ? '✓' : '!'} Kiểm tra: ${esc(it.check)}</span></div>` : '';

        const whHtml = it.wh.length ? `
            <div class="sec-label">Tồn theo kho</div>
            <div class="wh-row">${it.wh.map(w => `<div class="wh ${w.qty > 0 ? 'on' : ''}"><span class="id">${esc(w.id)}</span><span class="n">${esc(w.qty)}</span></div>`).join('')}</div>` : '';

        return `
            <article class="card ${typeClass}">
                <div class="c-head">
                    <span class="code">${esc(it.code)}</span>
                    <span class="tags">
                        ${it.tab ? `<span class="badge-type">${esc(it.tab.toUpperCase())}</span>` : ''}
                    </span>
                </div>
                ${it.en ? `<div class="name-en">${esc(it.en)}</div>` : ''}
                ${it.vn ? `<div class="name-vn">${esc(it.vn)}</div>` : ''}
                <div class="hl">
                    <div class="hl-box b-stt"><span class="lbl">STT</span>${val(it.stt)}</div>
                    <div class="hl-box b-khay"><span class="lbl">Khay</span>${val(it.khay)}</div>
                </div>
                <div class="facts">
                    <div class="fact qty"><span class="lbl">Số lượng (Qty)</span>${show(it.qty) !== null ? `<span class="val">${esc(it.qty)}</span>` : `<span class="val">0</span>`}</div>
                    <div class="fact"><span class="lbl">Xuất xứ</span>${val(it.coo)}</div>
                </div>
                ${whHtml}
                ${show(it.note) !== null ? `<div class="note">${NOTE_ICON}<span>${esc(it.note)}</span></div>` : ''}
                ${checkHtml}
            </article>`;
    }

    function handleSearch(force) {
        const keyword = document.getElementById('searchInput').value.trim().toUpperCase();
        const box = document.getElementById('results');
        lastResultCount = 0;

        if (!force && norm(keyword).length < 4) {
            box.innerHTML = `<div class="empty-message">Nhập từ 4 ký tự trở lên hoặc bấm nút quét để tra mã vạch.</div>`;
            renderHistory();
            return;
        }
        document.getElementById('history').style.display = 'none';

        const filtered = search(keyword);
        lastResultCount = filtered.length;

        if (filtered.length === 0) {
            box.innerHTML = `<div class="empty-message">${SEARCH_ICON}Không tìm thấy mã nào chứa "${esc(keyword)}"</div>`;
            return;
        }

        box.innerHTML = `<div class="result-count">Tìm thấy ${filtered.length} kết quả</div>` + filtered.map(cardHtml).join('');
    }

    // ---------- Lịch sử tra cứu ----------
    function loadHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
    }
    function saveHistory(kw) {
        try {
            let list = loadHistory().filter(x => norm(x) !== norm(kw));
            list.unshift(kw);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_MAX)));
        } catch (e) { /* bỏ qua nếu trình duyệt chặn lưu */ }
    }
    function clearHistory() {
        try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
        renderHistory();
    }
    function renderHistory() {
        const el = document.getElementById('history');
        const list = loadHistory();
        if (!list.length) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.innerHTML = `
            <div class="history-head"><span>Tra gần đây</span><button class="history-clear" onclick="clearHistory()">Xóa</button></div>
            <div class="chips">${list.map((x, i) => `<button class="chip" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
        el.querySelectorAll('.chip').forEach(btn => {
            btn.onclick = () => {
                const kw = list[btn.dataset.i];
                document.getElementById('searchInput').value = kw;
                handleSearch(true);
                saveHistory(kw);
            };
        });
    }

    // ---------- Quét mã vạch bằng camera ----------
    // Thùng hàng có nhiều mã vạch (UPC, tem phụ, Part Number...). Web đọc tất cả,
    // chỉ nhận mã nào có trong danh sách ITEM CODE, các mã còn lại bỏ qua.
    const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    const NATIVE_FORMATS = ['code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar'];
    const VIDEO_CONSTRAINTS = { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } };

    // Chỉ đọc mã vạch nằm trên vạch đỏ: cắt một dải ngang quanh vạch đỏ rồi mới giải mã.
    const LINE_BAND = 0.45;   // chiều cao dải quét so với chiều cao khung (khớp CSS .scan-frame::before)
    const LINE_CORE = 0.35;   // mã vạch phải chạm vào vùng lõi này (±35% chiều cao dải) quanh vạch đỏ

    let camIdleTimer = null;
    let scanning = false, scanStream = null, scanTimer = null, torchOn = false;
    let nativeDetector = null, zxReader = null;
    const scanCanvas = document.createElement('canvas');
    const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
    const bandCanvas = document.createElement('canvas');
    const bandCtx = bandCanvas.getContext('2d', { willReadFrequently: true });
    let lastMiss = '', lastMissAt = 0;
    let frameCount = 0, lastRead = '', photoBusy = false;

    async function initEngine() {
        if (nativeDetector || zxReader) return;
        if ('BarcodeDetector' in window) {
            try {
                const supported = await BarcodeDetector.getSupportedFormats();
                const formats = NATIVE_FORMATS.filter(f => supported.includes(f));
                if (formats.length) nativeDetector = new BarcodeDetector({ formats });
            } catch (e) { nativeDetector = null; }
        }
        if (!nativeDetector) {
            await loadZxing();
            const F = ZXing.BarcodeFormat;
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR]);
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            zxReader = new ZXing.MultiFormatReader();
            zxReader.setHints(hints);
        }
    }

    function updateDebug(video) {
        document.getElementById('scanDebug').textContent =
            `v6 · ${nativeDetector ? 'BarcodeDetector' : 'ZXing'} · ${video.videoWidth}x${video.videoHeight} · ${frameCount} khung · đọc: ${lastRead || 'chưa thấy mã nào'}`;
    }

    function setScanMsg(t) { document.getElementById('scanMsg').textContent = t; }

    function loadZxing() {
        return new Promise((resolve, reject) => {
            if (window.ZXing) return resolve();
            const s = document.createElement('script');
            s.src = ZXING_URL;
            s.onload = resolve;
            s.onerror = () => reject(new Error('Không tải được bộ quét'));
            document.head.appendChild(s);
        });
    }

    async function openScanner() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('Không mở được camera. Web cần chạy bằng HTTPS (không mở trực tiếp file).');
            return;
        }
        document.getElementById('scanner').classList.add('open');
        document.getElementById('torchBtn').style.display = 'none';
        setScanMsg('Đang mở camera...');
        scanning = true;
        nativeDetector = null;
        zxReader = null;
        lastMiss = '';
        frameCount = 0;
        lastRead = '';

        try {
            await initEngine();
            if (!scanning) return;

            const video = document.getElementById('scanVideo');
            clearTimeout(camIdleTimer);
            if (!scanStream || !scanStream.getVideoTracks().some(t => t.readyState === 'live')) {
                scanStream = await navigator.mediaDevices.getUserMedia({ video: VIDEO_CONSTRAINTS, audio: false });
                scanStream.getVideoTracks().forEach(t => t.addEventListener('ended', () => { scanStream = null; }));
            }
            if (!scanning) return;
            video.srcObject = scanStream;
            await video.play();
            setupTorch();
            tryContinuousFocus();
            setScanMsg('Đặt mã vạch Part Number nằm trên vạch đỏ');
            startLoop(video);
        } catch (e) {
            console.error(e);
            const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
            setScanMsg(denied ? 'Chưa được cấp quyền camera. Hãy cho phép camera trong cài đặt trình duyệt rồi thử lại.'
                              : 'Không mở được camera: ' + (e.message || e.name));
        }
    }

    function startLoop(video) {
        let busy = false;
        scanTimer = setInterval(async () => {
            if (busy || photoBusy || !scanning || video.readyState < 2 || !video.videoWidth) return;
            busy = true;
            try {
                const texts = await readFrame(video);
                frameCount++;
                const useful = texts.filter(t => !isDigitsOnly(t));
                if (useful.length) lastRead = useful[0];
                else if (texts.length) lastRead = '(bỏ qua mã chỉ có số)';
                updateDebug(video);
                if (scanning) handleTexts(texts);
            } catch (e) { console.error(e); }
            busy = false;
        }, 120);
    }

    // Mực in xanh trên thùng giấy nâu rất khó đọc. Kênh màu ĐỎ làm vạch xanh thành đen,
    // nền giấy nâu thành sáng, nên chuyển ảnh sang xám theo kênh đỏ rồi tăng tương phản.
    function enhance(ctx, w, h) {
        const img = ctx.getImageData(0, 0, w, h), d = img.data, n = w * h;
        const hist = new Uint32Array(256);
        for (let i = 0; i < n; i++) hist[d[i * 4]]++;
        const cut = n * 0.02;
        let lo = 0, hi = 255, acc = 0;
        for (; lo < 255; lo++) { acc += hist[lo]; if (acc > cut) break; }
        acc = 0;
        for (; hi > 0; hi--) { acc += hist[hi]; if (acc > cut) break; }
        if (hi - lo < 20) { lo = 0; hi = 255; }
        const k = 255 / (hi - lo);
        for (let i = 0; i < n; i++) {
            let v = (d[i * 4] - lo) * k;
            v = v < 0 ? 0 : v > 255 ? 255 : v;
            d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
        }
        ctx.putImageData(img, 0, 0);
    }

    // Tính dải ảnh (theo toạ độ pixel của video) nằm quanh vạch đỏ.
    // Video dùng object-fit: cover nên phải quy đổi từ vị trí trên màn hình sang pixel video.
    function getLineRoi(video) {
        const vw = video.videoWidth, vh = video.videoHeight;
        const frame = document.getElementById('scanFrame');
        const vr = video.getBoundingClientRect(), fr = frame.getBoundingClientRect();
        let x, w, cy, bh;
        if (vr.width && vr.height && fr.width && fr.height) {
            const sc = Math.max(vr.width / vw, vr.height / vh);
            const ox = (vr.width - vw * sc) / 2, oy = (vr.height - vh * sc) / 2;
            x = (fr.left - vr.left - ox) / sc;
            w = fr.width / sc;
            cy = (fr.top + fr.height / 2 - vr.top - oy) / sc;
            bh = fr.height * LINE_BAND / sc;
        } else {   // dự phòng nếu không đo được
            x = vw * 0.07; w = vw * 0.86; cy = vh * 0.45; bh = vh * 0.26 * LINE_BAND;
        }
        let y = cy - bh / 2;
        x = Math.max(0, x); y = Math.max(0, y);
        w = Math.min(vw - x, w); bh = Math.min(vh - y, bh);
        return { x, y, w: Math.max(1, w), h: Math.max(1, bh) };
    }

    function drawRoi(video, roi, enh) {
        const s = Math.min(1, 1600 / roi.w);
        const w = Math.max(1, Math.round(roi.w * s)), h = Math.max(1, Math.round(roi.h * s));
        if (scanCanvas.width !== w || scanCanvas.height !== h) { scanCanvas.width = w; scanCanvas.height = h; }
        scanCtx.drawImage(video, roi.x, roi.y, roi.w, roi.h, 0, 0, w, h);
        if (enh) enhance(scanCtx, w, h);
        return { w, h };
    }

    // BarcodeDetector: chỉ giữ mã có vùng chạm vạch đỏ (giữa dải), ưu tiên mã gần tâm nhất.
    async function nativeOnLine(canvas, w, h) {
        const found = await nativeDetector.detect(canvas);
        const mid = h / 2, core = h * LINE_CORE;
        const hit = found.filter(c => {
            const b = c.boundingBox;
            return b && b.y <= mid + core && b.y + b.height >= mid - core;
        });
        hit.sort((p, q) => Math.abs(p.boundingBox.x + p.boundingBox.width / 2 - w / 2)
                         - Math.abs(q.boundingBox.x + q.boundingBox.width / 2 - w / 2));
        return hit.map(c => c.rawValue);
    }

    async function readFrame(video) {
        const roi = getLineRoi(video);
        let { w, h } = drawRoi(video, roi, true);

        let texts;
        if (nativeDetector) {
            texts = await nativeOnLine(scanCanvas, w, h);
            if (!texts.some(t => resolveScan(t))) {
                ({ w, h } = drawRoi(video, roi, false));   // thử thêm ảnh gốc (cùng dải đó)
                texts = texts.concat(await nativeOnLine(scanCanvas, w, h));
            }
        } else {
            texts = zxDecodeLine(scanCanvas, w, h);
        }
        if (!texts.some(t => resolveScan(t))) {            // dự phòng: tem in mực xanh bè vạch (Code 39)
            ({ w, h } = drawRoi(video, roi, true));
            const t = c39FromCanvas(scanCtx, w, h);
            if (t && !texts.includes(t)) texts.push(t);
        }
        return texts;
    }

    function zxTry(canvas) {
        try {
            const lum = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
            const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
            return zxReader.decode(bmp).getText();
        } catch (e) { return null; }
    }

    // ZXing trên dải quanh vạch đỏ: thử lõi hẹp ở giữa trước, rồi mở rộng dần.
    function zxDecodeLine(canvas, w, h) {
        const out = [];
        for (const [ya, yb] of [[0.25, 0.75], [0, 1]]) {
            for (const [xa, xb] of [[0.2, 0.8], [0, 1]]) {
                const x = Math.round(w * xa), y = Math.round(h * ya);
                const cw = Math.max(1, Math.round(w * (xb - xa))), ch = Math.max(1, Math.round(h * (yb - ya)));
                if (bandCanvas.width !== cw || bandCanvas.height !== ch) { bandCanvas.width = cw; bandCanvas.height = ch; }
                bandCtx.drawImage(canvas, x, y, cw, ch, 0, 0, cw, ch);
                const t = zxTry(bandCanvas);
                if (t && !out.includes(t)) { out.push(t); if (resolveScan(t)) return out; }
            }
        }
        return out;
    }

    // ZXing chỉ trả 1 mã mỗi lần, nên đọc cả khung rồi đọc thêm 3 dải ngang
    // để bắt được các mã vạch khác nhau trên cùng thùng.
    function zxDecode(canvas, w, h) {
        const out = [];
        let t = zxTry(canvas);
        if (t) { out.push(t); if (resolveScan(t)) return out; }
        for (const [a, b] of [[0, 0.45], [0.275, 0.725], [0.55, 1]]) {
            const y = Math.round(h * a), bh = Math.round(h * (b - a));
            if (bandCanvas.width !== w || bandCanvas.height !== bh) { bandCanvas.width = w; bandCanvas.height = bh; }
            bandCtx.drawImage(canvas, 0, y, w, bh, 0, 0, w, bh);
            t = zxTry(bandCanvas);
            if (t) { out.push(t); if (resolveScan(t)) break; }
        }
        return out;
    }

    // ---------- Bộ đọc Code 39 dự phòng ----------
    // Mã in mực xanh bóng/dập nổi trên thùng (vạch bị "bè" mực, vạch mảnh/khoảng trắng to) làm ZXing/BarcodeDetector
    // không nhận. Bộ này lấy trung bình nhiều hàng ảnh thành 1 đường cắt, thử nhiều ngưỡng sáng/tối,
    // rồi phân loại vạch to/nhỏ theo THỨ HẠNG trong từng ký tự (3 phần tử rộng nhất trong 9) nên chịu được mực bè.
    const C39_ALPHA = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%';
    const C39_ENC = [0x034,0x121,0x061,0x160,0x031,0x130,0x070,0x025,0x124,0x064,0x109,0x049,0x148,0x019,0x118,0x058,0x00D,0x10C,0x04C,0x01C,
                     0x103,0x043,0x142,0x013,0x112,0x052,0x007,0x106,0x046,0x016,0x181,0x0C1,0x1C0,0x091,0x190,0x0D0,0x085,0x184,0x0C4,0x0A8,
                     0x0A2,0x08A,0x02A];
    const C39_STAR = 0x094;

    // 9 độ rộng -> mẫu bit (bit=1 là vạch rộng). Trả -1 nếu không phân biệt rõ 3 rộng / 6 hẹp.
    function c39Pattern(wd) {
        const idx = wd.map((v, i) => i).sort((a, b) => wd[b] - wd[a]);
        if (wd[idx[2]] <= wd[idx[3]]) return -1;
        let p = 0;
        for (let k = 0; k < 3; k++) p |= 1 << (8 - idx[k]);
        return p;
    }

    // runs: [{c: 0|1, n: độ dài}] xen kẽ; barColor: màu của vạch (1 = tối). Trả chuỗi hoặc null.
    function c39FromRuns(runs, barColor) {
        for (let i = 1; i + 9 < runs.length; i++) {
            if (runs[i].c !== barColor) continue;
            const wd = []; for (let k = 0; k < 9; k++) wd.push(runs[i + k].n);
            if (c39Pattern(wd) !== C39_STAR) continue;
            const narrow = (wd.slice().sort((a, b) => a - b).slice(0, 6).reduce((s, v) => s + v, 0)) / 6;
            if (runs[i - 1].n < narrow * 3) continue;           // phải có vùng trống trước mã
            let out = '', j = i + 10, ok = false;
            while (j + 8 < runs.length && out.length < 40) {
                const w2 = []; for (let k = 0; k < 9; k++) w2.push(runs[j + k].n);
                const pat = c39Pattern(w2);
                if (pat < 0) break;
                if (pat === C39_STAR) {
                    const after = runs[j + 9];                    // sau mã cũng phải có vùng trống
                    ok = out.length > 0 && (!after || after.n >= narrow * 3);
                    break;
                }
                const ci = C39_ENC.indexOf(pat);
                if (ci < 0) break;
                const gap = runs[j + 9];
                if (!gap || gap.n > narrow * 3.2) break;         // khe giữa 2 ký tự phải hẹp
                out += C39_ALPHA[ci];
                j += 10;
            }
            if (ok) return out;
        }
        return null;
    }

    // Gộp các vạch nhiễu 1 pixel vào hai phía để không làm vỡ mẫu vạch.
    function c39Despeckle(runs) {
        const out = [];
        for (const r of runs) {
            const last = out[out.length - 1];
            if (last && last.c === r.c) last.n += r.n;
            else out.push({ c: r.c, n: r.n });
        }
        for (let i = 1; i < out.length - 1; i++) {
            if (out[i].n <= 1 && out[i - 1].c === out[i + 1].c) {
                out[i - 1].n += out[i].n + out[i + 1].n;
                out.splice(i, 2);
                i--;
            }
        }
        return out;
    }

    // gray: Uint8 (w x h). Lấy trung bình hàng y0..y1 -> đường cắt -> quét nhiều ngưỡng, thử cả 2 cực tính.
    function c39FromProfile(gray, w, y0, y1) {
        const rows = Math.max(1, y1 - y0);
        const p = new Float32Array(w);
        for (let y = y0; y < y1; y++) { const o = y * w; for (let x = 0; x < w; x++) p[x] += gray[o + x]; }
        for (let x = 0; x < w; x++) p[x] /= rows;
        const s = new Float32Array(w);
        for (let x = 0; x < w; x++) s[x] = (p[Math.max(0, x - 1)] + p[x] + p[Math.min(w - 1, x + 1)]) / 3;
        const sorted = Float32Array.from(s).sort();
        const lo = sorted[Math.floor(w * 0.01)], hi = sorted[Math.min(w - 1, Math.floor(w * 0.995))];
        if (hi - lo < 25) return null;
        for (let f = 0.15; f <= 0.8; f += 0.035) {
            const thr = lo + (hi - lo) * f;
            const raw = [];
            let c = s[0] < thr ? 1 : 0, n = 1;
            for (let x = 1; x < w; x++) {
                const v = s[x] < thr ? 1 : 0;
                if (v === c) n++; else { raw.push({ c, n }); c = v; n = 1; }
            }
            raw.push({ c, n });
            const runs = c39Despeckle(raw);
            if (runs.length < 40) continue;
            const r = c39FromRuns(runs, 1) || c39FromRuns(runs, 0);
            if (r) return r;
        }
        return null;
    }

    function c39Gray(ctx, w, h) {
        const d = ctx.getImageData(0, 0, w, h).data;
        const g = new Uint8Array(w * h);
        for (let i = 0, n = w * h; i < n; i++) g[i] = d[i * 4];
        return g;
    }

    // Quét dải quanh vạch đỏ: thử dải giữa trước, rồi nửa trên, nửa dưới, cả dải.
    function c39FromCanvas(ctx, w, h) {
        const g = c39Gray(ctx, w, h);
        for (const [a, b] of [[0.3, 0.7], [0.1, 0.5], [0.5, 0.9], [0, 1]]) {
            const y0 = Math.floor(h * a), y1 = Math.max(y0 + 1, Math.floor(h * b));
            const r = c39FromProfile(g, w, y0, y1);
            if (r) return r;
        }
        return null;
    }

    // Ảnh chụp tĩnh (không có vạch đỏ): trượt dải ngang từ trên xuống, trả mã đầu tiên có trong danh sách.
    function c39ScanAll(ctx, w, h) {
        const g = c39Gray(ctx, w, h);
        const bh = Math.max(40, Math.round(h * 0.05)), step = Math.max(20, Math.round(bh / 2));
        const found = [];
        for (let y = 0; y + bh <= h; y += step) {
            const r = c39FromProfile(g, w, y, y + bh);
            if (r && !found.includes(r)) { found.push(r); if (resolveScan(r)) return found; }
        }
        return found;
    }

    // Quy tắc nhận mã khi quét (chặt hơn so với gõ tay):
    //  - Mã CHỈ CÓ SỐ (số lượng "1", mã tem phụ 4002489713...) bị bỏ qua,
    //    trừ khi trùng khớp hoàn toàn với một ITEM CODE trong danh sách.
    //  - Mã có chữ: nhận nếu trùng ITEM CODE (bỏ tiền tố "1P" nếu có),
    //    hoặc chứa nguyên một ITEM CODE (từ 5 ký tự) bên trong.
    const isDigitsOnly = t => /^\d+$/.test(String(t).trim());

    function resolveScan(text) {
        const t = String(text || '').trim();
        if (!t) return null;
        const numeric = isDigitsOnly(t);
        if (!allItems.length) return numeric ? null : t;  // dữ liệu chưa tải xong
        const find = x => allItems.find(it => it.nCode === norm(x));
        let it;
        if (/^1P/i.test(t) && (it = find(t.slice(2)))) return it.code;
        if ((it = find(t))) return it.code;
        if (numeric) return null;
        const n = norm(t);
        let best = null;
        for (const x of allItems) {
            if (x.nCode.length >= 5 && n.includes(x.nCode) && (!best || x.nCode.length > best.nCode.length)) best = x;
        }
        return best ? best.code : null;
    }

    function handleTexts(texts) {
        for (const raw of texts) {
            const code = resolveScan(raw);
            if (code) { onScanned(code); return; }
        }
        const useful = texts.filter(t => !isDigitsOnly(t));   // mã chỉ có số: im lặng bỏ qua
        if (useful.length) {
            const t = useful[0], now = Date.now();
            if (t !== lastMiss || now - lastMissAt > 2500) {
                lastMiss = t; lastMissAt = now;
                setScanMsg(`Đọc được "${t}" nhưng không có trong danh sách. Hãy đặt đúng mã vạch Part Number lên vạch đỏ.`);
            }
        }
    }

    function getTrack() { return scanStream && scanStream.getVideoTracks()[0]; }

    function setupTorch() {
        const track = getTrack();
        const caps = track && track.getCapabilities ? track.getCapabilities() : {};
        const btn = document.getElementById('torchBtn');
        torchOn = false;
        btn.classList.remove('on');
        btn.style.display = caps.torch ? 'block' : 'none';
    }

    async function toggleTorch() {
        const track = getTrack();
        if (!track) return;
        try {
            torchOn = !torchOn;
            await track.applyConstraints({ advanced: [{ torch: torchOn }] });
            document.getElementById('torchBtn').classList.toggle('on', torchOn);
        } catch (e) { torchOn = false; }
    }

    function tryContinuousFocus() {
        const track = getTrack();
        if (track && track.applyConstraints) {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }
    }

    function beep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = 1000;
            osc.connect(ctx.destination);
            osc.start();
            setTimeout(() => { osc.stop(); ctx.close(); }, 120);
        } catch (e) {}
        if (navigator.vibrate) navigator.vibrate(80);
    }

    function onScanned(code) {
        if (!scanning) return;
        finishScan(code);
    }

    function finishScan(code) {
        beep();
        closeScanner();
        document.getElementById('searchInput').value = code.toUpperCase();
        handleSearch(true);
        saveHistory(code.toUpperCase());
    }

    // Chụp ảnh tĩnh: ảnh từ app camera nét và to hơn khung hình video nên dễ đọc hơn.
    async function decodeStill(bmp) {
        const out = [];
        for (const maxSide of [2200, 1400]) {
            const sc = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
            const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
            for (const enh of [true, false]) {
                if (scanCanvas.width !== w || scanCanvas.height !== h) { scanCanvas.width = w; scanCanvas.height = h; }
                scanCtx.drawImage(bmp, 0, 0, w, h);
                if (enh) enhance(scanCtx, w, h);
                const texts = nativeDetector
                    ? (await nativeDetector.detect(scanCanvas)).map(c => c.rawValue)
                    : zxDecode(scanCanvas, w, h);
                for (const t of texts) if (!out.includes(t)) out.push(t);
                if (out.some(t => resolveScan(t))) return out;
                if (enh) for (const t of c39ScanAll(scanCtx, w, h)) if (!out.includes(t)) out.push(t);
                if (out.some(t => resolveScan(t))) return out;
            }
        }
        return out;
    }

    async function handlePhoto(input) {
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        photoBusy = true;
        setScanMsg('Đang đọc ảnh...');
        document.getElementById('results').innerHTML = `<div class="empty-message">Đang đọc ảnh...</div>`;
        let msg = '';
        try {
            await initEngine();
            const bmp = await createImageBitmap(file);
            const texts = await decodeStill(bmp);
            for (const raw of texts) {
                const code = resolveScan(raw);
                if (code) { photoBusy = false; finishScan(code); return; }
            }
            msg = texts.length
                ? `Đọc được "${texts[0]}" nhưng không có trong danh sách. Hãy chụp mã vạch Part Number.`
                : 'Không đọc được mã vạch trong ảnh. Chụp gần hơn, đủ sáng, thật nét rồi thử lại.';
        } catch (e) {
            console.error(e);
            msg = 'Không đọc được ảnh: ' + (e.message || e.name);
        }
        photoBusy = false;
        setScanMsg(msg);
        if (!scanning) document.getElementById('results').innerHTML = `<div class="empty-message">❌ ${esc(msg)}</div>`;
    }

    // Đóng khung quét nhưng GIỮ camera đã được cấp quyền để lần quét sau không hỏi lại.
    // Camera tự nhả sau 10 phút không dùng để đỡ hao pin.
    function releaseCamera() {
        if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
        document.getElementById('scanVideo').srcObject = null;
    }
    function closeScanner() {
        scanning = false;
        clearInterval(scanTimer);
        scanTimer = null;
        nativeDetector = null;
        zxReader = null;
        try { const t = getTrack(); if (torchOn && t) t.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {}
        torchOn = false;
        document.getElementById('scanVideo').pause();
        document.getElementById('scanner').classList.remove('open');
        clearTimeout(camIdleTimer);
        camIdleTimer = setTimeout(releaseCamera, 10 * 60 * 1000);
    }

    // ---------- Giữ màn hình luôn sáng (Screen Wake Lock) ----------
    // Tự xin lại khi quay về trang; nhả sau 15 phút không chạm để tránh hao pin.
    let wakeLock = null, wakeIdle = null;
    // Dự phòng cho iPhone/trình duyệt cũ không có Wake Lock: phát một video đen 2 giây lặp vô hạn (không tiếng).
    let nsVideo = null;
    function fallbackAwake() {
        try {
            if (!nsVideo) {
                nsVideo = document.createElement('video');
                nsVideo.setAttribute('playsinline', ''); nsVideo.setAttribute('muted', ''); nsVideo.muted = true; nsVideo.loop = true;
                nsVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;left:0;top:0';
                nsVideo.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAOybW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAB9AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAtx0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAB9AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAEAAAABAAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAfQAAAQAAABAAAAAAJUbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAAAoAAAAUABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAAB/21pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAb9zdGJsAAAAv3N0c2QAAAAAAAAAAQAAAK9hdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAEAAQABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAANWF2Y0MBZAAK/+EAGGdkAAqs2UQmwEQAAAMABAAAAwAoPEiWWAEABmjr48siwP34+AAAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAANXAAADVwAAAAYc3R0cwAAAAAAAAABAAAACgAACAAAAAAUc3RzcwAAAAAAAAABAAAAAQAAAGBjdHRzAAAAAAAAAAoAAAABAAAQAAAAAAEAACgAAAAAAQAAEAAAAAABAAAAAAAAAAEAAAgAAAAAAQAAKAAAAAABAAAQAAAAAAEAAAAAAAAAAQAACAAAAAABAAAQAAAAABxzdHNjAAAAAAAAAAEAAAABAAAACgAAAAEAAAA8c3RzegAAAAAAAAAAAAAACgAAAtcAAAAOAAAADAAAAAwAAAAMAAAAFAAAAA4AAAAMAAAADAAAABQAAAAUc3RjbwAAAAAAAAABAAAD4gAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjAuMTYuMTAwAAAACGZyZWUAAANfbWRhdAAAAq0GBf//qdxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0xIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDM6MHgxMTMgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTEgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MyBiX3B                 document.body.appendChild(nsVideo);
            }
            if (nsVideo.paused) nsVideo.play().catch(() => {});
        } catch (e) {}
    }
    async function keepAwake() {
        try {
            if (!('wakeLock' in navigator)) { fallbackAwake(); return; }
            if (document.visibilityState !== 'visible' || wakeLock) return;
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (e) { wakeLock = null; }
    }
    function onActivity() {
        keepAwake();
        clearTimeout(wakeIdle);
        wakeIdle = setTimeout(() => { if (wakeLock) wakeLock.release(); if (nsVideo) nsVideo.pause(); }, 15 * 60 * 1000);
    }
    ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, onActivity, { passive: true }));

    document.addEventListener('keydown', e => { if (e.key === 'Escape' && scanning) closeScanner(); });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { if (scanning) closeScanner(); }
        else onActivity();
    });
</script>
